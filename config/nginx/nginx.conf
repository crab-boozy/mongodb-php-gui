# Static nginx configuration. Logging and size limits are fixed by design
# (no access log, errors at crit, 52M body = 50MB import file + multipart
# overhead). See docs/README.md, "Production notes".
worker_processes 1;
pid /var/lib/nginx/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    sendfile on;
    server_tokens off;
    client_max_body_size 52M;

    server {
        listen 0.0.0.0:8080;

        root /app;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; blob-src 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location ~ /\. {
            deny all;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location /source/css/ {
            try_files $uri =404;
        }

        location /source/js/ {
            try_files $uri =404;
        }

        location ~ \.php$ {
            return 404;
        }

        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /app/index.php;
        }

        location / {
            rewrite ^ /index.php?$args last;
        }
    }
}
