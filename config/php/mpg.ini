; Static PHP runtime configuration. Import limits and logging are fixed by
; design (see docs/README.md, "Production notes"): 50MB import file,
; production error_reporting, no error display.
upload_max_filesize = 50M
post_max_size = 52M
upload_tmp_dir = /tmp
session.save_path = /var/lib/php/sessions
session.use_strict_mode = 1
; A 50MB JSON import is fully decoded in memory (file string + document
; array), so the production default of 128M is not enough.
memory_limit = 512M
expose_php = Off
error_reporting = E_ERROR | E_WARNING | E_PARSE | E_RECOVERABLE_ERROR
display_errors = 0
log_errors = On
error_log = /dev/stderr
