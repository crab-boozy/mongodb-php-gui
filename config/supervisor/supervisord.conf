; No log files: supervisord's own output goes to stderr.

[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=/var/lib/supervisor/supervisord.pid

[unix_http_server]
file=/var/lib/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/lib/supervisor/supervisor.sock

[program:php-fpm]
command=php-fpm -F -y /app/config/php/fpm/php-fpm.conf
priority=1
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /app/config/runtime/nginx/nginx.conf -g "daemon off;"
priority=2
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
