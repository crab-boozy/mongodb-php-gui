# NOTE on scaling: sessions are stored in pod-local files, so keep
# replicas: 1. Scaling above 1 requires sticky sessions (ingress) or a
# shared session backend - out of scope for the current release.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-php-gui
  labels:
    app: mongodb-php-gui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-php-gui
  template:
    metadata:
      labels:
        app: mongodb-php-gui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 808
        runAsGroup: 808
        fsGroup: 808
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # TODO: pin the image by digest before the production rollout.
          image: samueltallet/mongodb-php-gui:1.3.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # All MPG_* values are explicit on purpose: production must not
            # rely on code defaults.
            - name: MPG_DEBUG
              value: "0"
            - name: MPG_ALLOWED_MONGODB_HOSTS
              value: "" # TODO: exact hostnames, comma-separated
            - name: MPG_ALLOWED_MONGODB_DOMAINS
              value: "" # TODO: suffix domains, comma-separated
            - name: MPG_DEFAULT_DOCUMENTS
              value: "100"
            - name: MPG_MAX_DOCUMENTS
              value: "1000" # production policy; MUST override the 1000000 code default
            - name: MPG_QUERY_MAX_TIME_MS
              value: "60000"
            - name: MPG_SERVER_SELECTION_TIMEOUT_MS
              value: "5000"
            - name: MPG_CONNECT_TIMEOUT_MS
              value: "5000"
            - name: MPG_SOCKET_TIMEOUT_MS
              value: "10000"
            - name: MPG_MAX_IMPORT_SIZE
              value: "10485760"
            - name: MPG_MAX_IMPORT_DOCUMENTS
              value: "10000"
            # TLS terminates at the ingress.
            - name: MPG_COOKIE_SECURE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # TODO: size the requests/limits from real CPU/RAM/latency metrics.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: php-data
              mountPath: /var/lib/php
            - name: nginx-data
              mountPath: /var/lib/nginx
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: supervisor-data
              mountPath: /var/lib/supervisor
            - name: runtime-config
              mountPath: /app/config/runtime
      volumes:
        - name: php-data
          emptyDir: {}
        - name: nginx-data
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: supervisor-data
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
